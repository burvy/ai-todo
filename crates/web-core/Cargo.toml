[package]
name = "rambl-web-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "The web page's core (ARCHITECTURE 8A): its rules and numbers, with no DOM, tested natively. The page (rambl-web) is the views over it."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
todo-core = { path = "../core" }
# A title is written one grapheme at a time: an accent, a skin tone, a flag or a
# ZWJ family is one glyph on the page.
unicode-segmentation = "1.13"

[dev-dependencies]
chrono-tz = "0.10"
