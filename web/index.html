<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rambl</title>
  <link data-trunk rel="rust" href="Cargo.toml">
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
    body { max-width: 1100px; margin: 0 auto; padding: 1rem; }
    main { display: grid; gap: 1rem; grid-template-columns: minmax(16rem, 1fr) minmax(24rem, 2fr); }
    section { border: 1px solid currentColor; border-radius: .5rem; padding: 1rem; }
    input, button { font: inherit; padding: .5rem; }
    .capture { display: flex; gap: .5rem; }
    .capture input { flex: 1; }
    .mascot-circle { display: inline-flex; width: 2rem; height: 2rem; align-items: center; justify-content: center; border: 1px solid currentColor; border-radius: 50%; }
    .mascot-circle img { width: 1.5rem; height: 1.5rem; }
    @media (prefers-reduced-motion: reduce) { .mascot-circle, .mascot-circle img { transition: none; animation: none; } }
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: .25rem; overflow-x: auto; }
    .day { min-width: 7rem; border-left: 1px solid currentColor; padding: .25rem; }
    .hour { min-height: 2rem; border-top: 1px solid color-mix(in srgb, currentColor 25%, transparent); }
    .placement { border: 1px solid currentColor; border-radius: .25rem; padding: .2rem; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body></body>
</html>
