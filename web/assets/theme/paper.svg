<!-- PLACEHOLDER: replace me, see web/assets/theme/README.md -->
<!-- Light parchment: one full-bleed colour with stitched grain, no frame, so it tiles without seams. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 0.05 0"/>
  </filter>
  <rect width="512" height="512" fill="#f2e8cf"/>
  <rect width="512" height="512" filter="url(#grain)"/>
</svg>
