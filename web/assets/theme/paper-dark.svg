<!-- Concept art (ping/paper-concept, drawn in-repo): dark paper grain.
     Same four stitched layers as paper.svg, rebalanced for a dark sheet: the
     light grain carries more, the dark mottle stays soft. Bright warm charcoal
     base — paper at night, brighter than the old #241c11 and not brown — as
     the fallback of the parchment token; the app overrides it when inlined.
     No prefers-color-scheme in here: the app picks this file for dark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Dark paper grain">
  <defs>
    <filter id="cloud-dark" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.013" numOctaves="4" seed="11" stitchTiles="stitch"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.04
                0 0 0 0 0.035
                0 0 0 0 0.025
                0.42 0.42 0.42 0 -0.55"/>
    </filter>
    <filter id="cloud-lit" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.014" numOctaves="4" seed="29" stitchTiles="stitch"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.96
                0 0 0 0 0.93
                0 0 0 0 0.82
                -0.42 -0.42 -0.42 0 0.5"/>
    </filter>
    <filter id="speck-dark" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.03
                0 0 0 0 0.028
                0 0 0 0 0.02
                0 0 0 0.08 0"/>
    </filter>
    <filter id="speck-lit" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.97
                0 0 0 0 0.94
                0 0 0 0 0.85
                0 0 0 0.065 0"
        result="a"/>
      <feComponentTransfer in="a">
        <feFuncA type="table" tableValues="1 0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" fill="var(--parchment,#48443a)"/>
  <rect width="512" height="512" filter="url(#cloud-lit)" opacity="0.12"/>
  <rect width="512" height="512" filter="url(#cloud-dark)" opacity="0.2"/>
  <rect width="512" height="512" filter="url(#speck-dark)"/>
  <rect width="512" height="512" filter="url(#speck-lit)" opacity="0.9"/>
</svg>
