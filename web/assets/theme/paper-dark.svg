<!-- Dark parchment: same stitched grain as paper.svg, on the dark paper colour, no frame. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.75  0 0 0 0 0.68  0 0 0 0 0.55  0 0 0 0.05 0"/>
  </filter>
  <rect width="512" height="512" fill="#1e1811"/>
  <rect width="512" height="512" filter="url(#grain)"/>
</svg>
