<!-- PLACEHOLDER: replace me, see art/GUIDE.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 112" role="img" aria-label="Rambo (marker), listening">
  <!-- Colours come from the rambo tokens in theme.css, with today's light value as the fallback, so the drawing follows data-theme. FE-2. -->
  <g id="art">
    <!-- sound arcs: he is listening, no microphone -->
    <path d="M45 44 q5 6 0 12" fill="none" stroke="var(--rambo-fx, #4a939f)" stroke-width="1.6" stroke-linecap="round" />
    <path d="M50 40 q8 10 0 20" fill="none" stroke="var(--rambo-fx, #4a939f)" stroke-width="1.6" stroke-linecap="round" />
    <path d="M19 44 q-5 6 0 12" fill="none" stroke="var(--rambo-fx, #4a939f)" stroke-width="1.6" stroke-linecap="round" />
    <g id="art">
      <rect x="21" y="25" width="22" height="63" rx="7" fill="var(--rambo-barrel, #146272)" />
      <path d="M27 36 L27 76" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2.4" stroke-linecap="round" />
      <path d="M26 88 L38 88 L33.5 105 L30.5 105 Z" fill="var(--rambo-nib, #9f682e)" />
      <path d="M30.5 105 L33.5 105 L32 109.5 Z" fill="var(--rambo-lead, #004552)" />
      <path d="M37 74 q2.4 3.2 0 5 q-2.4 -1.8 0 -5 Z" fill="var(--rambo-ink, #004552)" />
      <circle cx="25.6" cy="84" r="1.1" fill="var(--rambo-ink, #004552)" />
      <rect x="20" y="9" width="24" height="15" rx="3" fill="var(--rambo-cap, #9f682e)" />
      <path d="M37 11 L37 21" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2.6" stroke-linecap="round" />
      <path d="M26 18 L26 22" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round" />
      <circle cx="32" cy="11.4" r="1.9" fill="var(--rambo-nib, #9f682e)" />
      <!-- wide eyes, pupils up-left towards whoever is talking -->
      <circle cx="28.6" cy="55" r="5.2" fill="var(--rambo-eye, #FCFAF4)" />
      <circle cx="28.4" cy="54.4" r="2.2" fill="var(--rambo-pupil, #004552)" />
      <circle cx="35.6" cy="55" r="5.2" fill="var(--rambo-eye, #FCFAF4)" />
      <circle cx="35.4" cy="54.4" r="2.2" fill="var(--rambo-pupil, #004552)" />
      <!-- brows up, listening -->
      <path d="M24.4 45.6 Q28.2 42.9 32 44.2" fill="none" stroke="var(--rambo-brow, #004552)" stroke-width="2" stroke-linecap="round" />
      <path d="M33.2 44.2 Q37 42.9 40.8 45.6" fill="none" stroke="var(--rambo-brow, #004552)" stroke-width="2" stroke-linecap="round" />
      <!-- small attentive mouth -->
      <path d="M29.6 64.4 Q32 66.6 34.4 64.4" fill="none" stroke="var(--rambo-lead, #004552)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
