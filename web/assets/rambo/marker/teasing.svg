<!-- PLACEHOLDER: replace me, see art/GUIDE.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 112" role="img" aria-label="Rambo (marker), teasing">
  <style>
    /* An img element never sees the page's CSS, so the theme.css tokens are restated here. */
    svg{--rambo:#146272;--rambo-deep:#004552;--rambo-tint:#4a939f;--accent:#9f682e}
    @media (prefers-color-scheme:dark){svg{--rambo:#64bbc4;--rambo-deep:#358e9b;--rambo-tint:#a3dde0;--accent:#d9a45c}}
    svg{--rambo-barrel:var(--rambo);--rambo-cap:var(--accent);--rambo-nib:var(--accent);--rambo-lead:var(--rambo-deep);--rambo-ink:var(--rambo-deep);--rambo-eye:#FCFAF4;--rambo-pupil:var(--rambo-deep);--rambo-blush:#D08770;--rambo-fx:var(--rambo-tint);--rambo-brow:var(--rambo-deep)}
    .pen-barrel{fill:var(--rambo-barrel)}
    .pen-cap{fill:var(--rambo-cap)}
    .pen-nib{fill:var(--rambo-nib)}
    .pen-lead{fill:var(--rambo-lead)}
    .pen-gloss{stroke:rgba(255,255,255,.35);stroke-width:2.4;stroke-linecap:round;fill:none}
    .eye-white{fill:var(--rambo-eye)}
    .eye-black{fill:var(--rambo-pupil)}
    .brow{stroke:var(--rambo-brow);stroke-width:2;stroke-linecap:round;fill:none}
    .mouth{stroke:var(--rambo-lead);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .mouth-fill{fill:var(--rambo-lead)}
    .tongue{fill:var(--rambo-blush)}
    .lid{fill:var(--rambo-barrel)}
    .blush{fill:var(--rambo-blush);opacity:.45}
    .ink-drop{fill:var(--rambo-ink)}
    .fx{stroke:var(--rambo-fx);stroke-width:1.6;stroke-linecap:round;fill:none}
    .fx-fill{fill:var(--rambo-fx)}
  </style>
  <g class="pen-body" transform="rotate(5 32 100)">
    <rect class="pen-barrel" x="21" y="25" width="22" height="63" rx="7"/>
    <path class="pen-gloss" d="M27 36 L27 76"/>
    <path class="pen-nib" d="M26 88 L38 88 L33.5 105 L30.5 105 Z"/>
    <path class="pen-lead" d="M30.5 105 L33.5 105 L32 109.5 Z"/>
    <path class="ink-drop" d="M37 74 q2.4 3.2 0 5 q-2.4 -1.8 0 -5 Z"/>
    <circle class="ink-drop" cx="25.6" cy="84" r="1.1"/>
    <rect class="pen-cap" x="20" y="9" width="24" height="15" rx="3"/>
    <path class="pen-gloss" d="M37 11 L37 21" style="stroke-width:2.6"/>
    <path class="pen-gloss" d="M26 18 L26 22" style="stroke-width:2"/>
    <circle class="pen-nib" cx="32" cy="11.4" r="1.9"/>
    <circle class="eye-white" cx="28.6" cy="55" r="4.8"/>
    <circle class="eye-black" cx="29.8" cy="55.2" r="2.2"/>
    <path class="mouth" d="M31.2 55.8 Q35.6 50.8 40 55.8" style="stroke-width:2"/>
    <path class="brow" d="M24.4 46.4 Q28 43 32 44.4"/>
    <path class="brow" d="M33.4 47.4 Q36.6 46 40.4 48.2"/>
    <path class="mouth" d="M27.6 63 Q32 67 36.4 62.4"/>
    <path class="tongue" d="M33.4 64.6 Q36.4 65 36 68.6 Q33.2 68.6 33 64.6 Z"/>
  </g>
</svg>
