<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 56" role="img" aria-label="Rambo's nest">
  <style>
    svg{--rambo-barrel:#9F682E;--rambo-cap:#9F682E;--rambo-nib:#E1C38C;--rambo-lead:#3E2F1F;--rambo-ink:#5D4732;--rambo-eye:#FCFAF4;--rambo-pupil:#3E2F1F;--rambo-blush:#D08770;--rambo-fx:#A7865D;--rambo-brow:#3E2F1F}
    @media (prefers-color-scheme:dark){svg{--rambo-barrel:#C89B62;--rambo-cap:#C89B62;--rambo-nib:#E8D9B0;--rambo-ink:#C9AE85;--rambo-fx:#B5976D;--rambo-brow:#4A331D}}
    .nest-cup{fill:var(--rambo-nib);stroke:var(--rambo-ink);stroke-width:2;stroke-linejoin:round}
    .nest-hole{fill:var(--rambo-cap);opacity:.4}
    .nest-strip{stroke:var(--rambo-fx);stroke-width:2;stroke-linecap:round;fill:none}
    .nest-stitch{stroke:var(--rambo-fx);stroke-width:1.6;stroke-linecap:round;fill:none}
    .nest-shadow{fill:var(--rambo-ink);opacity:.12}
    .nest-dot{fill:var(--rambo-ink)}
  </style>
