<!-- Concept art (ping/paper-concept, drawn in-repo): the nest as furniture —
     a shallow paper dish, ecru with a chamoisee rim, pressed-in inside
     (docs/DESIGN-DIRECTION.md §2). Same filename, viewBox and class names as
     the old placeholder; colours are app tokens with light fallbacks, so an
     inlined copy follows the theme. No prefers-color-scheme in here. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 56" role="img" aria-label="Rambo's nest">
  <defs>
    <filter id="nest-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>
  <style>
    .nest-cup{fill:var(--ecru,#e1c38c)}
    .nest-rim{fill:none;stroke:var(--chamoisee,#a7865d);stroke-width:2.4;stroke-linecap:round}
    .nest-hole{fill:var(--chamoisee,#a7865d);opacity:.26}
    .nest-shade{fill:none;stroke:var(--chamoisee,#a7865d);opacity:.38;stroke-width:2;stroke-linecap:round}
    .nest-stitch{fill:none;stroke:var(--wheat,#ecd7af);opacity:.75;stroke-width:1.5;stroke-linecap:round}
    .nest-strip{fill:none;stroke:var(--chamoisee,#a7865d);stroke-width:1.8;stroke-linecap:round}
    .nest-shadow{fill:var(--ink,#5d4732);opacity:.15}
    .nest-dot{fill:var(--chamoisee,#a7865d);opacity:.8}
  </style>
  <!-- the sheet's shadow under the dish -->
  <ellipse class="nest-shadow" cx="48" cy="45.5" rx="29" ry="4" filter="url(#nest-soft)"/>
  <!-- dish interior: pressed-in paper -->
  <ellipse class="nest-cup" cx="48" cy="26" rx="30" ry="8"/>
  <ellipse class="nest-hole" cx="48" cy="26.5" rx="25.5" ry="6.2"/>
  <path class="nest-shade" d="M26 23.5 Q48 16.5 70 23.5"/>
  <!-- front wall -->
  <path class="nest-cup" d="M18 26 Q22 39 48 41 Q74 39 78 26 A30 8 0 0 1 18 26 Z"/>
  <path class="nest-stitch" d="M27 34.5 Q48 40 69 34.5"/>
  <!-- the lip: a hand-drawn ellipse, two arcs of slightly different squash -->
  <path class="nest-rim" d="M18 26 A30 8 0 1 1 78 26 A30 7 0 1 1 18 26"/>
  <!-- stray fibres and flecks, as on real paper -->
  <path class="nest-strip" d="M23 22 Q20.5 18.5 22 16"/>
  <path class="nest-strip" d="M74 22.5 Q76.5 19 75 16.5"/>
  <circle class="nest-dot" cx="14" cy="33" r="1.1"/>
  <circle class="nest-dot" cx="83" cy="34.5" r="1"/>
</svg>
