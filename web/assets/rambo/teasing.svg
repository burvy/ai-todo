<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: replace me, see art/GUIDE.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 112">
  <style>
    .pen-barrel{fill:#2F5D9E}.pen-cap{fill:#24486F}.pen-nib{fill:#D9CFB8}
    .pen-lead{fill:#2B2A28}.pen-gloss{stroke:rgba(255,255,255,.35);stroke-width:2.4;stroke-linecap:round;fill:none}
    .eye-white{fill:#FCFAF4}.eye-black{fill:#2B2A28}
    .brow{stroke:#24486F;stroke-width:1.5;stroke-linecap:round;fill:none;opacity:.8}
  </style>
  <g class="pen-body">
    <!-- Barrel -->
    <rect class="pen-barrel" x="23" y="22" width="18" height="66" rx="9" />
    <!-- Cap worn sideways like a mischievous cap -->
    <rect class="pen-cap" x="20" y="16" width="22" height="14" rx="7" />
    <rect class="pen-cap" x="22" y="12" width="18" height="8" rx="4" />
    <!-- Nib -->
    <path class="pen-nib" d="M23 88 L32 110 L41 88 Z" />
    <path class="pen-lead" d="M28.6 99.5 L32 110 L35.4 99.5 Z" />
    <!-- Gloss -->
    <path class="pen-gloss" d="M27 34 L27 78" />
    <!-- Eyes — one winking, one open -->
    <path class="eye-white" d="M26 52 q3.4 -1 6.8 0" stroke="#FCFAF4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle class="eye-white" cx="35.2" cy="52" r="4.6" />
    <circle class="eye-black" cx="35.7" cy="52" r="2.1" />
    <!-- Brows — one raised, one flat (smirk) -->
    <path class="brow" d="M26 44 q3.4 -3 6.8 -1" />
    <path class="brow" d="M32 45 q3.4 -1 6.8 0" />
    <!-- Smirk -->
    <path d="M29 60 q3 2 6 0" stroke="#24486F" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".6"/>
    <!-- Ink splatter — playful -->
    <circle cx="46" cy="58" r="1.5" fill="#2B2A28" opacity=".3"/>
    <circle cx="50" cy="55" r="1" fill="#2B2A28" opacity=".2"/>
    <circle cx="48" cy="62" r="1.2" fill="#2B2A28" opacity=".25"/>
  </g>
</svg>