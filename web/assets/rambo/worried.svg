    <circle class="eye-white" cx="29.4" cy="52" r="5" />
    <circle class="eye-black" cx="29.4" cy="52" r="2.3" />
    <circle class="eye-white" cx="35.2" cy="52" r="5" />
    <circle class="eye-black" cx="35.2" cy="52" r="2.3" />
