<!-- PLACEHOLDER: replace me, see art/GUIDE.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 112" role="img" aria-label="Rambo (quill), listening">
  <style>
    svg{--rambo-barrel:#ECD7AF;--rambo-cap:#A7865D;--rambo-nib:#E1C38C;--rambo-lead:#3E2F1F;--rambo-ink:#5D4732;--rambo-eye:#FCFAF4;--rambo-pupil:#3E2F1F;--rambo-blush:#D08770;--rambo-fx:#A7865D;--rambo-brow:#3E2F1F}
    @media (prefers-color-scheme:dark){svg{--rambo-barrel:#E8D9B0;--rambo-cap:#B5976D;--rambo-nib:#E8D9B0;--rambo-ink:#C9AE85;--rambo-fx:#B5976D;--rambo-brow:#4A331D}}
    .pen-barrel{fill:var(--rambo-barrel)}
    .pen-cap{fill:var(--rambo-cap)}
    .pen-nib{fill:var(--rambo-nib)}
    .pen-lead{fill:var(--rambo-lead)}
    .pen-gloss{stroke:rgba(255,255,255,.35);stroke-width:2.4;stroke-linecap:round;fill:none}
    .eye-white{fill:var(--rambo-eye)}
    .eye-black{fill:var(--rambo-pupil)}
    .brow{stroke:var(--rambo-brow);stroke-width:2;stroke-linecap:round;fill:none}
    .mouth{stroke:var(--rambo-lead);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .mouth-fill{fill:var(--rambo-lead)}
    .tongue{fill:var(--rambo-blush)}
    .lid{fill:var(--rambo-barrel)}
    .blush{fill:var(--rambo-blush);opacity:.45}
    .ink-drop{fill:var(--rambo-ink)}
    .fx{stroke:var(--rambo-fx);stroke-width:1.6;stroke-linecap:round;fill:none}
    .fx-fill{fill:var(--rambo-fx)}
  </style>
  <!-- sound arcs: he is listening, no microphone -->
  <path class="fx" d="M45 44 q5 6 0 12"/>
  <path class="fx" d="M50 40 q8 10 0 20"/>
  <path class="fx" d="M19 44 q-5 6 0 12"/>
  <g class="pen-body" transform="rotate(-4 32 104)">
    <path class="pen-barrel" d="M25.5 24 L38.5 24 L36.5 88 L27.5 88 Z"/>
    <path class="pen-gloss" d="M27 36 L27 76"/>
    <path class="pen-nib" d="M27.5 86 L32 110 L36.5 86 Z"/>
    <path class="pen-lead" d="M31.6 90 L32.4 90 L32 104 Z"/>
    <path class="ink-drop" d="M37 74 q2.4 3.2 0 5 q-2.4 -1.8 0 -5 Z"/>
    <circle class="ink-drop" cx="25.6" cy="84" r="1.1"/>
    <path class="pen-cap" d="M32 2 C 43 4 49 13 45.5 23 C 41 31 29 32 23 26 C 17 20 21 4 32 2 Z"/>
    <path class="pen-gloss" d="M30 6 C 26 10 25 16 26.5 23"/><path class="pen-gloss" d="M35 5.5 C 38 9 39 15 38 21"/>
    <path class="pen-gloss" d="M26 18 L26 22" style="stroke-width:2"/>
    <circle class="pen-nib" cx="32" cy="11.4" r="1.9"/>
    <!-- wide eyes, pupils up-left towards whoever is talking -->
    <circle class="eye-white" cx="28.6" cy="55" r="5.2"/>
    <circle class="eye-black" cx="28.4" cy="54.4" r="2.2"/>
    <circle class="eye-white" cx="35.6" cy="55" r="5.2"/>
    <circle class="eye-black" cx="35.4" cy="54.4" r="2.2"/>
    <!-- brows up, listening -->
    <path class="brow" d="M24.4 45.6 Q28.2 42.9 32 44.2"/>
    <path class="brow" d="M33.2 44.2 Q37 42.9 40.8 45.6"/>
    <!-- small attentive mouth -->
    <path class="mouth" d="M29.6 64.4 Q32 66.6 34.4 64.4"/>
  </g>
</svg>
