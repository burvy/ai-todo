      <path d="M26 18 L26 22" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round" />
      <circle cx="32" cy="11.4" r="1.9" fill="var(--rambo-nib, #9f682e)" />
