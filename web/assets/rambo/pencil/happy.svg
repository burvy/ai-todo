    <path class="mouth" d="M24.2 56.5 Q28.6 50.4 33 56.5" style="stroke-width:2"/>
    <path class="mouth" d="M31.2 56.5 Q35.6 50.4 40 56.5" style="stroke-width:2"/>
    <path class="brow" d="M24.6 44.8 Q28.4 42.9 32 44.2"/>
