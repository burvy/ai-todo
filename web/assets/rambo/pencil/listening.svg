  <path d="M50 40 q8 10 0 20" stroke="var(--rambo-fx, #4a939f)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M19 44 q-5 6 0 12" stroke="var(--rambo-fx, #4a939f)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <g id="art" transform="rotate(-4 32 104)">
    <path d="M23 30 L32 26 L41 30 L41 82 L32 86.5 L23 82 Z" fill="var(--rambo-barrel, #146272)"/>
    <path d="M27.5 33 L27.5 81" stroke="var(--rambo-fx, #4a939f)" stroke-width="1" stroke-linecap="round" fill="none"/><path d="M30.5 31.5 L30.5 83" stroke="var(--rambo-fx, #4a939f)" stroke-width="1" stroke-linecap="round" fill="none"/>
    <path d="M25 85 L32 110 L39 85 Z" fill="var(--rambo-nib, #9f682e)"/>
    <path d="M29.4 100.5 L32 110 L34.6 100.5 Z" fill="var(--rambo-lead, #004552)"/>
    <path d="M37 74 q2.4 3.2 0 5 q-2.4 -1.8 0 -5 Z" fill="var(--rambo-ink, #004552)"/>
    <circle cx="25.6" cy="84" r="1.1" fill="var(--rambo-ink, #004552)"/>
    <rect x="22.5" y="17.5" width="19" height="7" rx="2" fill="var(--rambo-cap, #9f682e)"/><rect x="23" y="10.5" width="18" height="9" rx="3.5" fill="var(--rambo-blush, #D08770)"/>
    
    
    
    <!-- wide eyes, pupils up-left towards whoever is talking -->
    <circle cx="28.6" cy="55" r="5.2" fill="var(--rambo-eye, #FCFAF4)"/>
    <circle cx="28.4" cy="54.4" r="2.2" fill="var(--rambo-pupil, #004552)"/>
    <circle cx="35.6" cy="55" r="5.2" fill="var(--rambo-eye, #FCFAF4)"/>
    <circle cx="35.4" cy="54.4" r="2.2" fill="var(--rambo-pupil, #004552)"/>
    <!-- brows up, listening -->
    <path d="M24.4 45.6 Q28.2 42.9 32 44.2" stroke="var(--rambo-brow, #004552)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M33.2 44.2 Q37 42.9 40.8 45.6" stroke="var(--rambo-brow, #004552)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- small attentive mouth -->
    <path d="M29.6 64.4 Q32 66.6 34.4 64.4" stroke="var(--rambo-lead, #004552)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
