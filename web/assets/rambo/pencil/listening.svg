<!-- PLACEHOLDER: replace me, see art/GUIDE.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 112" role="img" aria-label="Rambo (pencil), listening">
  <!-- sound arcs: he is listening, no microphone -->
