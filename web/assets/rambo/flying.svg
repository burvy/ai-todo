<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER: replace me, see art/GUIDE.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 112">
  <style>
    .pen-barrel{fill:#2F5D9E}.pen-cap{fill:#24486F}.pen-nib{fill:#D9CFB8}
    .pen-lead{fill:#2B2A28}.pen-gloss{stroke:rgba(255,255,255,.35);stroke-width:2.4;stroke-linecap:round;fill:none}
    .eye-white{fill:#FCFAF4}.eye-black{fill:#2B2A28}
    .brow{stroke:#24486F;stroke-width:1.5;stroke-linecap:round;fill:none;opacity:.8}
  </style>
  <g class="pen-body" transform="rotate(20 32 56)">
    <!-- Barrel -->
    <rect class="pen-barrel" x="23" y="22" width="18" height="66" rx="9" />
    <!-- Cap flying off, tilted back -->
    <g transform="translate(-6, -8) rotate(15 32 20)">
      <rect class="pen-cap" x="22" y="16" width="20" height="14" rx="7" />
      <rect class="pen-cap" x="24" y="12" width="16" height="8" rx="4" />
    </g>
    <!-- Nib -->
    <path class="pen-nib" d="M23 88 L32 110 L41 88 Z" />
    <path class="pen-lead" d="M28.6 99.5 L32 110 L35.4 99.5 Z" />
    <!-- Gloss -->
    <path class="pen-gloss" d="M27 34 L27 78" />
    <!-- Eyes — wide open, excited -->
    <circle class="eye-white" cx="29.4" cy="52" r="5" />
    <circle class="eye-black" cx="29.4" cy="52" r="2.2" />
    <circle class="eye-white" cx="35.2" cy="52" r="5" />
    <circle class="eye-black" cx="35.2" cy="52" r="2.2" />
    <!-- Brows — raised high -->
    <path class="brow" d="M26 43 q3.4 -3 6.8 0" />
    <path class="brow" d="M32 43 q3.4 -3 6.8 0" />
    <!-- Open mouth — whooshing -->
    <path d="M30 60 q2 3 4 0" stroke="#24486F" stroke-width="1.2" fill="none" stroke-linecap="round" opacity=".6"/>
    <!-- Motion lines behind -->
    <path d="M14 40 L8 36" stroke="#2F5D9E" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
    <path d="M14 50 L6 48" stroke="#2F5D9E" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
    <path d="M14 60 L8 60" stroke="#2F5D9E" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
  </g>
</svg>