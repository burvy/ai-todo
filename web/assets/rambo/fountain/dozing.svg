    <rect class="pen-cap" x="22" y="13" width="20" height="17" rx="7.5"/>
    <path class="pen-cap" d="M39 25.5 Q50 23.5 53 29 Q46 31.5 39 29.5 Z"/>
    <path class="pen-gloss" d="M26 18 L26 22" style="stroke-width:2"/>
    <circle class="pen-nib" cx="32" cy="11.4" r="1.9"/>
    <circle class="eye-white" cx="28.6" cy="55" r="4.8"/>
    <circle class="eye-black" cx="28.6" cy="56.4" r="2.2"/>
    <circle class="eye-white" cx="35.6" cy="55" r="4.8"/>
    <circle class="eye-black" cx="35.6" cy="56.4" r="2.2"/>
    <path class="lid" d="M23.8 55 A4.8 4.8 0 0 1 33.4 55 Z"/>
    <path class="lid" d="M30.8 55 A4.8 4.8 0 0 1 40.4 55 Z"/>
    <circle class="mouth-fill" cx="32" cy="63.5" r="1.7"/>
    <path class="brow" d="M24.6 49.4 Q28.4 48.5 32 50.8"/>
    <path class="brow" d="M33.2 50.8 Q36.6 48.5 40.4 49.4"/>
