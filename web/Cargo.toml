[package]
name = "rambl-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
chrono-tz = "0.10"
gloo-net = { version = "0.7", features = ["json"] }
uuid = { version = "1", features = ["v4", "js"] }
gloo-timers = { version = "0.4", features = ["futures"] }
rambl-brain = { path = "../crates/rambl-brain" }
js-sys = "0.3.102"
leptos = { version = "0.8.19", features = ["csr"] }
todo-core = { package = "todo-core", path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.106", features = ["Document", "DomRect", "DomTokenList", "Element", "File", "HtmlAudioElement", "HtmlCollection", "HtmlElement", "HtmlLiElement", "HtmlMediaElement", "Node", "FileList", "FormData", "HtmlInputElement", "HtmlTextAreaElement", "MediaQueryList", "PointerEvent", "SpeechRecognition", "SpeechRecognitionError", "SpeechRecognitionEvent", "Storage", "Window"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# A panic in the page otherwise reaches the console as "unreachable", with no message.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
