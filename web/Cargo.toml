[package]
name = "rambl-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
gloo-net = { version = "0.7", features = ["json"] }
gloo-timers = "0.3"
js-sys = "0.3.102"
leptos = { version = "0.8.19", features = ["csr"] }
todo-core = { package = "todo-core", path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.125"
web-sys = { version = "0.3.106", features = ["File", "FormData", "HtmlInputElement", "HtmlTextAreaElement", "MediaQueryList", "Window"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
